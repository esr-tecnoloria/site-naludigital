<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Nalu Digital - Criação de apps, bots, IA e sites. Soluções digitais inovadoras para transformar seu negócio.">
    <title>Nalu Digital - Em Desenvolvimento</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            padding: 0;
            margin: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #FFFFFF;
            color: #4A5568;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Hero - Logo grande + "em desenvolvimento" */
        .hero {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 3rem 1.5rem;
            background: linear-gradient(135deg, #F0F7FA 0%, #E0F2F7 50%, #F0F7FA 100%);
            text-align: center;
            min-height: 60vh;
        }

        .hero__logo {
            max-width: 400px;
            width: 80%;
            height: auto;
            margin-bottom: 2.5rem;
        }

        .hero__badge {
            display: inline-block;
            background: linear-gradient(135deg, #1A3B69, #2A7BA1);
            color: #FFFFFF;
            padding: 0.6rem 2rem;
            border-radius: 2rem;
            font-size: 0.875rem;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            margin-bottom: 1.5rem;
        }

        .hero__title {
            font-size: 2rem;
            font-weight: 700;
            color: #1A3B69;
            margin-bottom: 1rem;
        }

        .hero__subtitle {
            font-size: 1.125rem;
            font-weight: 400;
            color: #8A94A6;
            max-width: 500px;
        }

        /* Contato Section */
        .contato {
            padding: 4rem 0 3rem;
            background-color: #FFFFFF;
        }

        .container {
            max-width: 1200px;
            margin-left: auto;
            margin-right: auto;
            padding-left: 1rem;
            padding-right: 1rem;
        }

        .section__header {
            margin-bottom: 2.5rem;
            text-align: center;
        }

        .section__title {
            font-size: 1.75rem;
            color: #1A3B69;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .section__subtitle {
            color: #8A94A6;
            font-size: 1rem;
        }

        .contato__content {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .contato__info {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2rem;
            max-width: 1000px;
            width: 100%;
        }

        .contato__card {
            background: #FFFFFF;
            padding: 1.5rem;
            border-radius: 1rem;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
            transition: all 0.3s;
            text-align: center;
        }

        .contato__card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(26, 59, 105, 0.15);
        }

        .contato__icon {
            width: 50px;
            height: 50px;
            background: #1A3B69;
            border-radius: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #FFFFFF;
            margin: 0 auto 1rem;
        }

        .contato__card h3 {
            font-size: 1.125rem;
            margin-bottom: 0.5rem;
            color: #1A3B69;
            font-weight: 600;
        }

        .contato__card p {
            color: #4A5568;
        }

        /* Footer */
        .footer {
            background-color: #1A3B69;
            color: #FFFFFF;
            padding: 1.5rem 0;
            text-align: center;
        }

        .footer p {
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.875rem;
        }

        /* Responsive */
        @media screen and (max-width: 768px) {
            .hero__logo {
                max-width: 280px;
            }

            .hero__title {
                font-size: 1.5rem;
            }

            .hero__subtitle {
                font-size: 1rem;
            }

            .contato__info {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <!-- Hero -->
    <section class="hero">
        <img src="imagem/nalu_logo.png" alt="Nalu Digital" class="hero__logo">
        <span class="hero__badge">Em Desenvolvimento</span>
        <!-- <h1 class="hero__title">Estamos preparando algo novo</h1> -->
        <p class="hero__subtitle">Nosso novo site está em construção. Em breve, uma experiência digital completa para
            você.</p>
    </section>

    <!-- Contato Section -->
    <section class="contato" id="contato">
        <div class="container">
            <div class="section__header">
                <h2 class="section__title">Entre em Contato</h2>
                <p class="section__subtitle">
                    Pronto para transformar seu negócio? Vamos conversar!
                </p>
            </div>
            <div class="contato__content">
                <div class="contato__info">
                    <div class="contato__card">
                        <div class="contato__icon">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2">
                                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z">
                                </path>
                                <polyline points="22,6 12,13 2,6"></polyline>
                            </svg>
                        </div>
                        <h3>E-mail</h3>
                        <p>luoadebreu@gmail.com</p>
                    </div>
                    <div class="contato__card">
                        <div class="contato__icon">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2">
                                <path
                                    d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z">
                                </path>
                            </svg>
                        </div>
                        <h3>Telefone</h3>
                        <p>11 94303-3112</p>
                    </div>
                    <div class="contato__card">
                        <div class="contato__icon">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2">
                                <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                                <circle cx="12" cy="10" r="3"></circle>
                            </svg>
                        </div>
                        <h3>Localização</h3>
                        <p>Indaiatuba-SP</p>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 Nalu Digital.</p>
        </div>
    </footer>
</body>

</html>
